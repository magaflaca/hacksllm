server {
    listen 80;
    listen 443 ssl;
    server_name llm-origin.hacks.win;
    ssl_certificate /etc/nginx/ssl/embeds.crt;
    ssl_certificate_key /etc/nginx/ssl/embeds.key;
    client_max_body_size 32m;

    location /v1/ {
        proxy_pass http://127.0.0.1:20128;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location / {
        return 404;
    }
}
